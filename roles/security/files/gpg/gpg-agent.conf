# Managed by Ansible (workstation repository).
#
# Use the GNOME pinentry, which offers "Save in password manager" to store the
# key's passphrase in the GNOME login keyring. The keyring is unlocked on login,
# so stored passphrases are supplied without prompting. See docs/KEYRING.md.
pinentry-program /usr/bin/pinentry-gnome3
