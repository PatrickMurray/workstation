---
- name: Install git
  package:
    name: git
    state: latest


- name: Install git-crypt
  package:
    name: git-crypt
    state: latest


- name: Configure git user name
  git_config:
    name: user.name
    value: "{{ git.name }}"
    scope: global
  become: True
  become_user: "{{ user.name }}"


- name: Configure git user email
  git_config:
    name: user.email
    value: "{{ git.email }}"
    scope: global
  become: True
  become_user: "{{ user.name }}"


- name: Configure GPG signing
  git_config:
    name: commit.gpgsign
    value: true
    scope: global
  become: True
  become_user: "{{ user.name }}"


- name: Configure SSH signing format
  git_config:
    name: gpg.format
    value: ssh
    scope: global
  become: True
  become_user: "{{ user.name }}"


# The public key is configured so ssh-keygen signs via the SSH agent
# (gcr-ssh-agent), which unlocks the key with the passphrase stored in the
# GNOME login keyring.
- name: Configure SSH signing key
  git_config:
    name: user.signingkey
    value: "{{ user.home }}/.ssh/id-ed25519-workstation-2026-05-02.pub"
    scope: global
  become: True
  become_user: "{{ user.name }}"


- name: Create ~/.local/bin directory
  file:
    path: ~/.local/bin
    state: directory
    mode: 0755
  become: True
  become_user: "{{ user.name }}"


# Superseded: git signs with the workstation key via the SSH agent.
- name: Remove git-ssh-sign
  file:
    path: ~/.local/bin/git-ssh-sign
    state: absent
  become: True
  become_user: "{{ user.name }}"


- name: Remove SSH signing program
  git_config:
    name: gpg.ssh.program
    scope: global
    state: absent
  become: True
  become_user: "{{ user.name }}"


- name: Create ~/.ssh directory
  file:
    path: ~/.ssh
    state: directory
    mode: 0700
  become: True
  become_user: "{{ user.name }}"


- name: Configure SSH allowed signers
  template:
    src: git/allowed_signers.j2
    dest: ~/.ssh/allowed_signers
    mode: 0644
  become: True
  become_user: "{{ user.name }}"


- name: Configure SSH allowed signers file
  git_config:
    name: gpg.ssh.allowedSignersFile
    value: "{{ user.home }}/.ssh/allowed_signers"
    scope: global
  become: True
  become_user: "{{ user.name }}"


# Retained to verify historical GPG-signed commits.
- name: Configure GPG program
  git_config:
    name: gpg.program
    value: gpg
    scope: global
  become: True
  become_user: "{{ user.name }}"
