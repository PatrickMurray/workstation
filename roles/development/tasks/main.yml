---
- name: Include Components
  include_tasks:
    file: "components/{{ component }}.yml"
  loop_control:
    loop_var: component
  loop:
    - git
    - precommit
    - vim
    - make
    - gcc
    - python3
    - virtualenv
    - hugo
    - rust
    - npm
    - podman
    - kubectl
    - kind
    - tilt
    - visualstudiocode
    - claude
    - meld
    - github
