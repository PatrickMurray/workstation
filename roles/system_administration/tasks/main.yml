---
- name: Include Components
  include_tasks:
    file: "components/{{ component }}.yml"
  loop_control:
    loop_var: component
  loop:
    - ansible
    - butane
    - coreos_installer
    - awscli
    - boto
    - curl
    - htop
    - netcat
    - nmap
    - openssh
    - opentofu
    - pv
    - strace
    - telnet
    - traceroute
    - tree
    - unzip
    - wget
    - wireshark
    - fastfetch
