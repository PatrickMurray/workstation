---
- name: Create ~/.ssh directory
  file:
    path: ~/.ssh
    state: directory
    mode: 0700
  become: True
  become_user: "{{ user.name }}"


- name: Configure SSH
  copy:
    src: files/ssh/config
    dest: ~/.ssh/config
    mode: 0644
  become: True
  become_user: "{{ user.name }}"


# gcr-ssh-agent stores SSH key passphrases in the GNOME login keyring and
# unlocks the keys on login. It exports SSH_AUTH_SOCK to the user session.
- name: Install gcr
  package:
    name: gcr
    state: latest


- name: Enable gcr-ssh-agent
  systemd_service:
    name: gcr-ssh-agent.socket
    scope: global
    enabled: True


- name: Add Workstation 2026-05-02 SSH private key
  copy:
    src: files/ssh/id-ed25519-workstation-2026-05-02
    dest: ~/.ssh/id-ed25519-workstation-2026-05-02
    mode: 0600
  become: True
  become_user: "{{ user.name }}"


- name: Add Workstation 2026-05-02 SSH public key
  copy:
    src: files/ssh/id-ed25519-workstation-2026-05-02.pub
    dest: ~/.ssh/id-ed25519-workstation-2026-05-02.pub
    mode: 0644
  become: True
  become_user: "{{ user.name }}"


- name: Add Zbook 2017-09-27 SSH public key
  copy:
    src: files/ssh/id-rsa-zbook-2017-09-27.pub
    dest: ~/.ssh/id-rsa-zbook-2017-09-27.pub
    mode: 0644
  become: True
  become_user: "{{ user.name }}"


- name: Add Zbook 2017-09-27 SSH private key
  copy:
    src: files/ssh/id-rsa-zbook-2017-09-27
    dest: ~/.ssh/id-rsa-zbook-2017-09-27
    mode: 0600
  become: True
  become_user: "{{ user.name }}"


# Retained for the Include at the top of ~/.ssh/config.
- name: Create ~/.ssh/config.d directory
  file:
    path: ~/.ssh/config.d
    state: directory
    mode: 0700
  become: True
  become_user: "{{ user.name }}"


# Superseded: the YubiKey is no longer used for SSH.
- name: Remove YubiKey SSH configuration and keys
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - ~/.ssh/config.d/yubikeys.conf
    - ~/.ssh/id-ed25519-sk-yubikey-27414501-2026-11-11
    - ~/.ssh/id-ed25519-sk-yubikey-27414501-2026-11-11.pub
  become: True
  become_user: "{{ user.name }}"
