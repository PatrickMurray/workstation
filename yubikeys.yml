---
# YubiKeys enrolled for FIDO2 SSH authentication.
#
# Every workstation receives every key below. SSH offers the passphrase-protected
# workstation key first, then the key of whichever enrolled YubiKey is connected
# (FIDO2 PIN + touch). Git commit signing uses the workstation key; enrolled keys
# remain trusted for verifying past signatures.
#
# Enrollment and reset steps are documented in docs/YUBIKEY.md.
#
# Example:
#   yubikeys:
#     - name: yubikey-zbook
#       serial: 12345678
#       ssh_key: id-ed25519-sk-yubikey-12345678-2026-11-11
yubikeys:
  - name: yubikey-lenovo
    serial: 27414501
    ssh_key: id-ed25519-sk-yubikey-27414501-2026-11-11
